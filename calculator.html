<!DOCTYPE html>
<html>
<head>
<title>Job Board</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
}

/* Navbar */

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 40px;
background:#1e73be;
color:white;
}

.logo{
font-size:20px;
font-weight:bold;
}

nav a{
margin:0 10px;
text-decoration:none;
color:white;
font-size:14px;
}

.buttons button{
margin-left:10px;
padding:8px 15px;
border:none;
cursor:pointer;
}

.login{
background:white;
color:#1e73be;
}

.post{
background:#2ecc71;
color:white;
}

/* Hero Section */

.hero{
display:flex;
justify-content:space-between;
align-items:center;
padding:80px 60px;
background:linear-gradient(to right,#1e73be,#3498db);
color:white;
}

.hero-text h3{
font-weight:normal;
}

.hero-text h1{
font-size:45px;
margin:10px 0;
}

.hero-text p{
margin-bottom:20px;
}

.resume{
padding:12px 25px;
background:#2ecc71;
border:none;
color:white;
font-size:16px;
cursor:pointer;
}

.hero img{
width:250px;
}

/* Search Section */

.search{
background:#f2f2f2;
padding:25px;
display:flex;
justify-content:center;
gap:10px;
}

.search input, .search select{
padding:10px;
width:180px;
}

.search button{
padding:10px 20px;
background:#2ecc71;
border:none;
color:white;
cursor:pointer;
}

</style>

</head>

<body>

<header>

<div class="logo">🔍 Job Board</div>

<nav>
<a href="#">Home</a>
<a href="#">Browse Job</a>
<a href="#">Pages</a>
<a href="#">Blog</a>
<a href="#">Contact</a>
</nav>

<div class="buttons">
<button class="login">Log in</button>
<button class="post">Post A Job</button>
</div>

</header>

<section class="hero">

<div class="hero-text">
<h3>4536+ Jobs listed</h3>
<h1>Find your Dream Job</h1>
<p>We provide online instant job listings with quick approval.</p>

<button class="resume">Upload Your Resume</button>
</div>

<div>
<img src="img.jpg">
</div>

</section>

<div class="search">

<input type="text" placeholder="Search keyword">
<input type="text" placeholder="Location">

<select>
<option>Category</option>
<option>IT</option>
<option>Marketing</option>
<option>Design</option>
</select>

<button>Find Job</button>

</div>

</body>
</html>
